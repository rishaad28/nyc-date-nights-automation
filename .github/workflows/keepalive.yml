name: Keep scheduled automation active

on:
  schedule:
    - cron: "33 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .automation-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation-heartbeat
          git commit -m "Keep scheduled preview sync active"
          git push
